<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>兔子島點歌本</title>
<link rel="preconnect" href="https://docs.google.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="images/hero.webp" fetchpriority="high">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Serif+TC:wght@500;600;700&family=Fredoka:wght@500;600&display=swap">
<style>
/* Layout: a fairy-tale song book — full-bleed scenery that follows the viewer's clock (day / dusk / night), a floating glass nav, a glass sidebar of languages, a hero banner with the key illustration, the blue ribbon marquee, a glass song list, and a "pick one for me" card. Light glass on purpose, single theme. */
:root{
  color-scheme:light;
  --ink:#4a3550; --soft:#6f5a74; --muted:#9a879f; --hair:rgba(214,186,206,.55);
  --rose:#e46b9b; --rose-deep:#c4517f; --rose-mist:#ffe9f1;
  --lav:#9b8ce0; --ribbon:#8eb4f0; --ribbon-deep:#5a7fcf; --ribbon-mist:#eaf1fe;
  --apricot:#ec9a5c; --gold:#f2cf6a;
  --glass:rgba(255,255,255,.62); --glass-hi:rgba(255,255,255,.78); --edge:rgba(255,255,255,.85);
  --font-script:"Great Vibes","Snell Roundhand",cursive;
  --font-serif:"Noto Serif TC","Songti TC",serif;
  --font-sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-num:"Fredoka","Noto Sans TC",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{overflow-x:hidden}
html,body{margin:0}
body{color:var(--ink);font-family:var(--font-sans);font-size:15px;line-height:1.6;background:#f6e6f0;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2.5px solid var(--ribbon-deep);outline-offset:2px}

/* ---------- scenery ---------- */
.scene{position:fixed;inset:0;z-index:0;background:#f6e6f0 center/cover no-repeat;pointer-events:none}
.scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,244,250,.18),rgba(255,240,248,.42) 60%,rgba(255,236,246,.6))}
body.night .scene::after{background:linear-gradient(180deg,rgba(40,30,80,.08),rgba(60,40,100,.28))}
.petals{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.petals i{position:absolute;top:-30px;width:14px;height:11px;border-radius:150% 0 150% 0;background:linear-gradient(135deg,#ffd3e4,#f79bbf);opacity:.8;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,-20px) rotate(0)}100%{transform:translate(-120px,110vh) rotate(540deg)}}

.page{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:14px 90px}

/* ---------- glass ---------- */
.glass{background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 18px 40px -26px rgba(150,80,140,.45)}

/* ---------- nav ---------- */
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:10;display:flex;align-items:center;gap:12px;padding:8px 10px 8px 18px;border-radius:999px}
.nav .brand{display:flex;align-items:center;gap:10px;min-width:0}
.nav .brand img{height:70px;width:auto;display:block;margin-block:-8px;filter:drop-shadow(0 1px 1px rgba(196,81,127,.45)) drop-shadow(0 4px 10px rgba(196,81,127,.3))}
.nav{background:rgba(255,255,255,.92);padding-block:10px}
.nav .links{margin-left:auto;display:flex;gap:8px}
.plat{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;background:var(--glass-hi);border:1px solid var(--edge);font-weight:500;font-size:14px;white-space:nowrap;transition:transform .2s,box-shadow .2s}
.plat:hover{transform:translateY(-1px);box-shadow:0 8px 18px -12px rgba(150,80,140,.6)}
.plat .ic{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#fff;flex:none}
.plat.tw .ic{background:linear-gradient(135deg,#b49bff,#8b5cf6)}
.plat.yt .ic{background:linear-gradient(135deg,#ff9cb5,#ef4f78)}
.plat svg{width:14px;height:14px}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-areas:"hero hero" "marq marq" "list aside";gap:18px;margin-top:6px;align-items:start}
.hero{grid-area:hero}
.marq{grid-area:marq}
.list{grid-area:list}
.aside{grid-area:aside;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:grid;gap:16px}
.script{font-family:var(--font-script);font-weight:400;color:var(--lav);line-height:1;margin:0}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:34px;min-height:440px;border:1px solid var(--edge);box-shadow:0 24px 50px -30px rgba(150,80,140,.6)}
.hero img.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:70% 30%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,246,251,.92) 0%,rgba(255,246,251,.72) 28%,rgba(255,246,251,0) 58%)}
.langswitch{position:absolute;z-index:3;top:16px;right:16px;display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(255,255,255,.72);border:1px solid var(--edge);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 8px 18px -12px rgba(150,80,140,.6)}
.langswitch button{border:0;background:transparent;padding:4px 12px;border-radius:999px;cursor:pointer;font-size:13px;color:var(--soft);font-family:var(--font-sans)}
.langswitch button:hover{background:rgba(255,255,255,.9)}
.langswitch button[aria-pressed="true"]{background:linear-gradient(100deg,#f08bb4,#e46b9b);color:#fff}
html[lang="ja"]{--font-serif:"Noto Serif JP","Noto Serif TC","Hiragino Mincho ProN",serif;--font-sans:"Noto Sans JP","Noto Sans TC","Hiragino Sans",system-ui,sans-serif}
html[lang="ja"] .hero-title h1{letter-spacing:.04em}
html[lang="en"] .hero-title h1{letter-spacing:.02em}
html[lang="en"] .quote,html[lang="ja"] .quote{letter-spacing:.04em}
.hero-title{position:absolute;z-index:2;top:22px;left:clamp(22px,4vw,48px);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hero-title h1{margin:0;display:flex;align-items:center;gap:6px;font-family:var(--font-serif);font-weight:700;font-size:36px;letter-spacing:.08em;line-height:1.15;color:#4b3452;text-shadow:0 1px 12px rgba(255,255,255,.95)}
.hero-title h1 svg{width:24px;height:21px;margin-top:-14px}
.hero-title .script{font-size:34px;line-height:1.35;color:var(--rose);text-shadow:0 1px 10px rgba(255,255,255,.95)}
.hero .copy{position:relative;z-index:1;display:grid;gap:2px;justify-items:start;max-width:min(540px,54%);padding:92px 0 30px clamp(22px,4vw,48px)}
.hero-logo{display:block;width:min(100%,420px);height:auto;margin:0 0 4px -6px;filter:drop-shadow(0 2px 2px rgba(196,81,127,.35)) drop-shadow(0 8px 18px rgba(255,255,255,.9))}
.hero-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.quote{margin:2px 0 0;font-family:var(--font-serif);font-size:clamp(13.5px,1.3vw,15.5px);letter-spacing:.12em;line-height:1.9;color:#5c4762}
.quote.soft{color:var(--soft)}
.hero-logo+.quote{margin-top:8px}
.quote b{color:var(--rose-deep);font-weight:600}
.free-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
a.free{transition:transform .2s}
a.free:hover{transform:translateY(-1px)}
.donate .go{font-family:var(--font-num);font-size:12px;opacity:.75}
.free{display:inline-flex;align-items:center;gap:6px;padding:4px 14px;border-radius:999px;background:rgba(255,255,255,.8);border:1px solid var(--edge);font-size:13px;color:var(--rose-deep);font-weight:500}

/* ---------- marquee (kept) ---------- */
.marquee{position:relative;margin:2px -10px;transform:rotate(-1.4deg);background:linear-gradient(90deg,#8eb4f0,#a7b8f4 50%,#8eb4f0);color:#fff;border-block:3px solid #fff;box-shadow:0 10px 22px -16px #5a7fcf;overflow:hidden;border-radius:4px}
.marquee::after{content:"";position:absolute;inset:4px 0;border-block:1.5px dashed rgba(255,255,255,.65);pointer-events:none}
.track{display:flex;width:max-content;animation:roll 30s linear infinite}
.track span{display:flex;align-items:center;gap:18px;padding:9px 9px;font-family:var(--font-num);font-weight:600;font-size:15px;letter-spacing:.12em;white-space:nowrap}
.track span b{font-family:var(--font-sans);font-weight:500;letter-spacing:.08em}
.track svg{width:14px;height:14px}
@keyframes roll{to{transform:translateX(-50%)}}

/* ---------- list ---------- */
.list{border-radius:30px;padding:20px 20px 12px}
.list-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px}
.list-head h2{margin:0;display:flex;align-items:center;gap:10px;font-family:var(--font-serif);font-weight:700;font-size:24px;letter-spacing:.08em}
.list-head h2 svg{width:24px;height:24px;color:var(--rose)}
.sync{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:#d4b8c9}
.sync.ok::before{background:#6fcf9d}
.tools{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:4;margin:14px -8px 0;padding:10px 8px;border-radius:20px;display:grid;gap:10px;grid-template-columns:minmax(0,1fr);background:rgba(255,248,252,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.search{display:flex;gap:10px;min-width:0}
.field{flex:1;min-width:0;position:relative}
.field svg{position:absolute;left:15px;top:50%;width:17px;height:17px;transform:translateY(-50%);color:var(--muted)}
.field input{width:100%;font:inherit;font-size:14px;padding:10px 16px 10px 42px;border-radius:999px;border:1px solid var(--edge);background:rgba(255,255,255,.85);color:var(--ink);box-shadow:inset 0 1px 3px rgba(150,80,140,.08)}
.field input::placeholder{color:#b9a5bc}
.field input:focus{outline:none;border-color:#f3b6cf;box-shadow:0 0 0 4px rgba(244,163,191,.25)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:0 18px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap;color:#fff;background:linear-gradient(100deg,#f08bb4,#e46b9b);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 18px -10px rgba(196,81,127,.8);transition:transform .2s}
.btn:hover{transform:translateY(-1px)}
.btn svg{width:15px;height:15px}
.sorts{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:0;background:rgba(255,255,255,.6);padding:5px 14px;border-radius:999px;cursor:pointer;font-size:13.5px;font-family:var(--font-serif);color:var(--soft)}
.pill:hover{background:#fff}
.pill[aria-pressed="true"]{background:linear-gradient(100deg,#f6a3c4,#e9799f);color:#fff;box-shadow:0 6px 14px -8px rgba(196,81,127,.8)}
.cats{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.cats .lbl{font-family:var(--font-serif);font-weight:600;font-size:13px;letter-spacing:.12em;color:var(--muted);margin-right:4px}
.cat{display:inline-flex;align-items:center;gap:7px;border:0;background:rgba(255,255,255,.6);padding:5px 12px;border-radius:999px;cursor:pointer;font-size:13.5px;font-family:var(--font-serif);color:var(--soft)}
.cat:hover{background:#fff}
.cat .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.cat .n{font-family:var(--font-num);font-size:12px;opacity:.7;font-variant-numeric:tabular-nums}
.cat[aria-pressed="true"]{background:linear-gradient(100deg,#f08bb4,#e46b9b);color:#fff;box-shadow:0 6px 14px -8px rgba(196,81,127,.8)}
.cat[aria-pressed="true"] .dot{box-shadow:0 0 0 2px rgba(255,255,255,.85)}

.thead,.row{display:grid;grid-template-columns:44px minmax(0,1fr) 86px auto;gap:12px;align-items:center}
.thead{padding:10px 10px 8px;margin-top:6px;font-size:12.5px;color:var(--muted);letter-spacing:.08em;border-bottom:1px solid var(--hair)}
.thead span:first-child{text-align:center}
.rows{list-style:none;margin:0;padding:0}
.rows li+li .row{border-top:1px solid rgba(214,186,206,.35)}
.row{width:100%;text-align:left;border:0;background:transparent;cursor:pointer;padding:11px 10px;border-radius:16px;transition:background .2s}
.row:hover{background:rgba(255,255,255,.7)}
.no{text-align:center;font-family:var(--font-num);font-size:13px;color:#b8a3ba;font-variant-numeric:tabular-nums}
.song{min-width:0}
.title{display:block;font-family:var(--font-serif);font-weight:500;font-size:16.5px;line-height:1.4;overflow-wrap:anywhere;transition:color .2s}
.artist{display:block;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.note{display:inline-block;margin-left:8px;font-family:var(--font-sans);font-size:11px;color:var(--ribbon-deep);background:var(--ribbon-mist);padding:0 8px;border-radius:999px;vertical-align:2px}
.tag{justify-self:start;font-size:11.5px;font-weight:700;color:#fff;padding:3px 13px 3px 9px;clip-path:polygon(0 0,100% 0,86% 50%,100% 100%,0 100%);border-radius:6px 0 0 6px;background:var(--c,var(--gold))}
.tag.mini{display:none}
.req{display:inline-flex;align-items:center;gap:5px;padding:4px 13px 4px 5px;border-radius:999px;font-size:13px;font-weight:500;color:var(--rose-deep);background:rgba(255,255,255,.85);border:1px solid var(--edge);white-space:nowrap;transition:background .2s,color .2s}
.req img{width:24px;height:24px;transition:transform .3s cubic-bezier(.3,1.7,.5,1)}
.row:hover .title{color:var(--rose-deep)}
.row:hover .req,.row:focus-visible .req{color:#fff;background:linear-gradient(100deg,#f08bb4,#e46b9b);border-color:transparent}
.row:hover .req img{transform:rotate(-15deg) translateY(-2px) scale(1.1)}
li.hit .row{background:linear-gradient(90deg,rgba(255,240,196,.9),rgba(255,255,255,.4))}
li.hit .req{background:var(--gold);color:var(--ink);border-color:transparent}
li.hit .req img{animation:hop .55s ease 3}
@keyframes hop{50%{transform:translateY(-6px) rotate(-12deg)}}
.empty{padding:44px 12px;text-align:center;color:var(--soft);font-family:var(--font-serif)}

/* ---------- aside ---------- */
.card{border-radius:28px;padding:20px}
.card h3{margin:0;display:flex;align-items:center;gap:8px;font-family:var(--font-serif);font-weight:700;font-size:17px;letter-spacing:.08em}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:14px;margin-left:auto}
.eq i{width:3px;border-radius:2px;background:linear-gradient(#f6a3c4,#b8a6f0);animation:eq 1s ease-in-out infinite}
.eq i:nth-child(1){height:40%}.eq i:nth-child(2){height:90%;animation-delay:-.3s}.eq i:nth-child(3){height:60%;animation-delay:-.6s}.eq i:nth-child(4){height:80%;animation-delay:-.15s}.eq i:nth-child(5){height:50%;animation-delay:-.45s}
@keyframes eq{50%{transform:scaleY(.35)}}
.eq i{transform-origin:bottom}
.pick{margin-top:16px;display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:center}
.pick .egg{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(140deg,#ffe3ef,#e6e3ff);box-shadow:inset 0 1px 0 #fff}
.pick .egg img{width:48px;height:48px}
.pick.spin .egg img{animation:hop .5s ease 2}
.pick .t{font-family:var(--font-serif);font-weight:600;font-size:17px;line-height:1.35;overflow-wrap:anywhere}
.pick .a{font-size:12.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.pick .tag{margin-top:6px;display:inline-block}
.pick-actions{margin-top:16px;display:flex;gap:8px}
.pick-actions .btn{flex:1;justify-content:center;padding:9px 12px}
.pick-actions .ghost{background:rgba(255,255,255,.8);color:var(--rose-deep);border:1px solid var(--edge);box-shadow:none}
.steps{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:13.5px;color:var(--soft)}
.steps li::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:26px;height:26px;border-radius:50%;font-family:var(--font-num);font-size:13px;color:#fff;background:linear-gradient(135deg,#a9c5f6,#7fa0ea)}
.steps code{font-family:var(--font-serif);color:var(--rose-deep);font-weight:600;white-space:nowrap}
.notice{margin:12px 0 0;padding-top:12px;border-top:1px solid var(--hair);font-size:13px;color:var(--muted);white-space:pre-wrap}
.notice:empty{display:none}

footer{margin-top:28px;text-align:center}
footer span{display:inline-block;padding:6px 18px;border-radius:999px;font-family:var(--font-script);font-size:24px;color:var(--rose-deep)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,14px);opacity:0;padding:11px 20px;border-radius:999px;font-size:14px;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);z-index:30;text-align:center;color:var(--ink);background:rgba(255,255,255,.85);border:1px solid var(--edge);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 14px 30px -14px rgba(150,80,140,.55)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.totop{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;cursor:pointer;z-index:20;color:var(--rose-deep);font-size:18px}

/* ---------- responsive ---------- */
@media (max-width:1000px){
  .layout{grid-template-columns:minmax(0,1fr);grid-template-areas:"hero" "marq" "list" "aside"}
  .aside{position:static}
}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr);grid-template-areas:"hero" "marq" "list" "aside";gap:16px}
  .hero-logo{width:min(100%,320px);margin-left:-4px}
  .hero{aspect-ratio:auto;min-height:0;max-height:none;border-radius:28px;background:rgba(255,248,252,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .hero img.art{position:relative;display:block;height:auto;aspect-ratio:16/10;object-position:68% 25%}
  .hero::after{inset:auto 0 0 0;top:0;height:auto;background:linear-gradient(0deg,rgba(255,248,252,1) 0%,rgba(255,248,252,0) 26%);pointer-events:none}
  .hero .copy{max-width:none;padding:0 20px 22px;margin-top:-34px}
  .hero-title{top:12px;left:16px;flex-direction:column;align-items:flex-start;gap:0}.hero-title .script{margin:-2px 0 0 10px}.hero-title h1{font-size:28px}.hero-title h1 svg{width:19px;height:17px;margin-top:-10px}.hero-title .script{font-size:27px}
  .quote{letter-spacing:.05em;line-height:1.8}
  .list{padding:16px 12px 8px;border-radius:26px}
  .tools{top:calc(env(safe-area-inset-top,0px) + 6px)}
  .thead{display:none}
  .row{grid-template-columns:30px minmax(0,1fr) auto;padding:11px 4px}
  .row .tag.col{display:none}
  .tag.mini{display:inline-block;font-size:10.5px;padding:1px 10px 1px 7px;margin-right:6px;vertical-align:1px}
  .req{padding:5px}.req .t{display:none}
}
/* ---------- 網頁點歌 ---------- */
.today{display:inline-block;margin-left:8px;font-family:var(--font-sans);font-size:11px;font-weight:700;color:#fff;background:linear-gradient(100deg,#9b8ce0,#8eb4f0);padding:0 9px;border-radius:999px;vertical-align:2px;white-space:nowrap}
li.req-today .req{background:var(--ribbon-mist);color:var(--ribbon-deep)}
.rq{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(74,53,80,.32);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:rqIn .18s ease}
.rq-box{position:relative;width:min(420px,100%);border-radius:28px;padding:24px 22px 18px;background:rgba(255,250,253,.94);border:1px solid var(--edge);box-shadow:0 30px 60px -24px rgba(120,60,110,.55);text-align:center;animation:rqPop .22s cubic-bezier(.3,1.5,.5,1)}
.rq-box .egg{width:54px;height:54px;margin:-52px auto 4px;display:block;filter:drop-shadow(0 6px 10px rgba(196,81,127,.35))}
.rq-box h2{margin:0 0 10px;font-family:var(--font-serif);font-size:19px;font-weight:700;color:var(--rose-deep)}
.rq-song{padding:12px 14px;border-radius:18px;background:var(--rose-mist);margin-bottom:12px}
.rq-song .t{font-family:var(--font-serif);font-size:18px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.rq-song .a{font-size:13px;color:var(--muted);margin-top:2px}
.rq-note{font-size:13px;color:var(--soft);line-height:1.7;margin:0 0 10px}
.rq-warn{font-size:13px;font-weight:700;color:var(--ribbon-deep);background:var(--ribbon-mist);border-radius:12px;padding:7px 10px;margin:0 0 10px}

  const n=q.toLowerCase();
  let r=SONGS.filter(s=>(lang==="全部"||s.lang===lang)&&(!n||s.title.toLowerCase().includes(n)||s.artist.toLowerCase().includes(n)));
  if(sort==="new")r=[...r].reverse();
  if(sort==="title")r=[...r].sort((a,b)=>coll.compare(a.title,b.title));
  if(sort==="artist")r=[...r].sort((a,b)=>coll.compare(a.artist||"~",b.artist||"~")||coll.compare(a.title,b.title));
  return r;
}
function render(){
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  document.querySelectorAll("[data-sort]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.sort===sort));
  const r=visible();
  $("list").innerHTML=r.length?r.map(s=>{const L=esc(langLabel(s.lang));const td=requestedToday(s);return `<li data-no="${s.no}"${td?' class="req-today"':""}><button class="row" type="button" data-no="${s.no}" aria-label="${esc(tr("copyLabel")(REQ?s.title:CONFIG.copyPrefix+s.title))}">
      <span class="no">${s.no}</span>
      <span class="song"><span class="title">${esc(s.title)}${s.note?`<span class="note">${esc(s.note)}</span>`:""}${td?`<span class="today">${esc(tr("todayBadge"))}</span>`:""}</span><span class="artist"><span class="tag mini" style="--c:${colorOf(s.lang)}">${L}</span>${esc(s.artist||"—")}</span></span>
      <span class="tag col" style="--c:${colorOf(s.lang)}">${L}</span>
      <span class="req"><img src="${EGG}" alt=""><span class="t">${esc(tr("req"))}</span></span>
    </button></li>`}).join(""):`<li class="empty">${esc(tr("empty"))}</li>`;
  if(picked)markHit(picked,false);
}
let tt;
function toast(m,ms=2200){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),ms)}
async function copy(s){
  const text=CONFIG.copyPrefix+s.title;
  try{await navigator.clipboard.writeText(text);toast(tr("copied")(text))}
  catch(e){toast(tr("manual")(text),3500)}
}
const byNo=n=>SONGS.find(s=>s.no===+n);
$("list").addEventListener("click",e=>{const b=e.target.closest(".row");if(!b)return;const s=byNo(b.dataset.no);REQ?openReq(s):copy(s)});
$("q").addEventListener("input",e=>{q=e.target.value.trim();render()});

function markHit(s,scroll){
  document.querySelectorAll("li.hit").forEach(x=>x.classList.remove("hit"));
  const li=document.querySelector(`li[data-no="${s.no}"]`);if(!li)return;
  li.classList.add("hit");
  if(scroll)li.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
}
function showPick(){
  if(picked){
    $("pickT").textContent=picked.title;$("pickA").textContent=picked.artist||"—";
    $("pickL").innerHTML=`<span class="tag" style="--c:${colorOf(picked.lang)}">${esc(langLabel(picked.lang))}</span>`;
    $("pickBtn").textContent=tr("pickAgain");$("pickCopy").hidden=false;
  }else{
    $("pickT").textContent=tr("pickIdle");$("pickA").textContent=tr("pickIdleSub");$("pickL").innerHTML="";
    $("pickBtn").textContent=tr("pickBtn");$("pickCopy").hidden=true;
  }
}
function pickOne(){
  const r=visible();if(!r.length){toast(tr("noPick"));return}
  let s=r[Math.floor(Math.random()*r.length)];
  if(picked&&r.length>1&&s.no===picked.no)s=r[(r.indexOf(s)+1)%r.length];
  picked=s;showPick();
  const pk=$("pick");pk.classList.remove("spin");void pk.offsetWidth;pk.classList.add("spin");
  const asideVisible=matchMedia("(min-width:1001px)").matches;
  markHit(s,!asideVisible);if(!REQ)copy(s);
}
$("pickCopy").addEventListener("click",()=>{if(picked)REQ?openReq(picked):copy(picked)});
const topBtn=$("totop");
addEventListener("scroll",()=>{topBtn.hidden=scrollY<700},{passive:true});
topBtn.onclick=()=>scrollTo({top:0,behavior:"smooth"});

/* ---------- 從 Google 試算表讀取最新歌單 ---------- */
function showSync(){const s=$("sync");s.textContent=tr({loading:"syncLoading",checking:"syncChecking",cached:"syncCached",ok:"syncOk",fallback:"syncFallback",builtin:"syncBuiltin"}[syncState]);s.classList.toggle("ok",syncState==="ok")}
function parseCSV(t){
  const rows=[];let row=[],f="",i=0,qd=false;
  for(;i<t.length;i++){const c=t[i];
    if(qd){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else qd=false}else f+=c}
    else if(c==='"')qd=true;else if(c===","){row.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}
    else f+=c}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows;
}
/* 上次讀到的歌單存在觀眾的瀏覽器裡，下次打開會立刻顯示，同時在背景檢查有沒有更新 */
const CACHE_KEY="songbook-sheet-v1";
function readCache(){try{const c=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");
  if(c&&c.id===CONFIG.sheetId+"|"+CONFIG.sheetName&&Array.isArray(c.songs)&&c.songs.length)return c.songs}catch(e){}return null}
function writeCache(list){try{localStorage.setItem(CACHE_KEY,JSON.stringify({id:CONFIG.sheetId+"|"+CONFIG.sheetName,songs:list}))}catch(e){}}
const plain=list=>list.map(({lang,artist,title,note})=>({lang,artist,title,note}));
function useList(list){
  const same=JSON.stringify(plain(SONGS))===JSON.stringify(plain(list));
  if(same)return;
  SONGS=list.map((s,i)=>({...s,no:i+1}));picked=null;showPick();buildControls();render();
}
async function loadSheet(){
  if(!CONFIG.sheetId){syncState="builtin";showSync();return}
  const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),12000);
  try{
    const url=`https://docs.google.com/spreadsheets/d/${CONFIG.sheetId}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(CONFIG.sheetName)}&_=${Date.now()}`;
    const res=await fetch(url,{cache:"no-store",signal:ctrl.signal});if(!res.ok)throw new Error(res.status);
    const rows=parseCSV(await res.text()).map(r=>r.map(c=>c.trim()));
    if(!rows.length)throw new Error("empty");
    const h=rows[0];if(h.some(c=>c.length>40))throw new Error("header");const ix=k=>h.findIndex(c=>c.includes(k));
    let li=ix("語言"),ai=ix("歌手"),ti=ix("歌名"),ni=ix("備註");let body=rows.slice(1);
    if(ti<0){li=0;ai=1;ti=2;ni=3;body=rows}
    const list=body.map(r=>({lang:(r[li]||"其他"),artist:r[ai]||"",title:r[ti]||"",note:ni>=0?(r[ni]||""):""})).filter(s=>s.title);
    if(!list.length)throw new Error("no songs");
    writeCache(list);useList(list);syncState="ok";showSync();
  }catch(e){syncState=syncState==="checking"?"cached":"fallback";showSync()}
  finally{clearTimeout(timer)}
}
/* ---------- 網頁點歌（requestUrl 有設定才會用到） ---------- */
const normT=s=>String(s==null?"":s).toLowerCase().replace(/\.[a-z0-9]{2,4}$/,"").replace(/[\s\-_()\[\]（）【】·・,，.。!！?？'"「」《》\/\\]/g,"");
let todaySet=new Set(),todayList=[],rqSong=null,rqBusy=false;
/* 後台回報「現在開不開放網頁點歌」（UtaStage 開著、而且勾了網頁點歌才開放）；還不知道之前先當作開放 */
let rqOpen=true;
function requestedToday(s){
  if(!todaySet.size)return false;
  const k=normT(s.title);if(!k)return false;
  if(todaySet.has(k))return true;
  /* 聊天室點的歌名可能多打了字（例如「點歌 紅色高跟鞋 蔡健雅」）→ 包含整個歌名也算 */
  return k.length>=2&&todayList.some(t=>t.length>k.length&&t.includes(k));
}
function setToday(titles){
  todayList=(titles||[]).map(normT).filter(Boolean);todaySet=new Set(todayList);render();
}
async function api(method,params,body){
  const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),15000);
  try{
    const url=CONFIG.requestUrl+(params?(CONFIG.requestUrl.includes("?")?"&":"?")+new URLSearchParams(params):"");
    const res=await fetch(url,method==="POST"?{method:"POST",body:JSON.stringify(body),headers:{"Content-Type":"text/plain;charset=utf-8"},signal:ctrl.signal}
                                               :{cache:"no-store",signal:ctrl.signal});
    return await res.json();
  }finally{clearTimeout(timer)}
}
function setOpen(v){
  if(v===undefined)return;
  rqOpen=!!v;showBanner();if(rqSong)refreshReq();
}
function showBanner(){
  const b=$("rqBanner");if(!b)return;
  const off=REQ&&!rqOpen;
  b.hidden=!off;if(off)b.textContent=tr("closed");
}
async function loadToday(){
  if(!REQ)return;
  try{const j=await api("GET",{action:"today",_:Date.now()});if(j&&j.ok){setOpen(j.open);setToday(j.titles)}}catch(e){}
}
function refreshReq(){
  const s=rqSong;if(!s)return;
  const done=requestedToday(s);
  $("rqDone").hidden=!done;$("rqDone").textContent=tr("rqDone");
  const why=done||rqOpen?"":tr("closed");
  $("rqWhy").hidden=!why;$("rqWhy").textContent=why;
  if(!rqBusy)$("rqOk").disabled=done||!rqOpen;
}
function openReq(s){
  if(!s)return;rqSong=s;rqBusy=false;
  $("rqTitle").textContent=tr("rqTitle");$("rqNote").innerHTML=tr("rqNote");
  $("rqSong").textContent=s.title;$("rqArtist").textContent=s.artist||"";
  $("rqCancel").textContent=tr("rqCancel");$("rqOk").textContent=tr("rqOk");
  $("rqCopy").textContent=tr("rqCopy");
  refreshReq();
  $("rq").hidden=false;
  setTimeout(()=>($("rqOk").disabled?$("rqCancel"):$("rqOk")).focus(),30);
  loadToday().then(()=>{if(rqSong===s)refreshReq()});      // 現在開不開放、今天點過哪些：問最新的
}
function closeReq(){$("rq").hidden=true;rqSong=null}
async function sendReq(){
  const s=rqSong;if(!s||rqBusy)return;
  rqBusy=true;$("rqOk").disabled=true;$("rqOk").textContent=tr("rqSending");
  let j=null;
  try{j=await api("POST",null,{action:"request",title:s.title,artist:s.artist})}catch(e){}
  rqBusy=false;$("rqOk").textContent=tr("rqOk");
  if(j&&j.ok){
    setOpen(j.open);if(j.titles)setToday(j.titles);
    closeReq();markHit(s,false);toast(j.dup?tr("reqDup"):tr("reqOk")(s.title),3200);return;
  }
  /* 失敗：原因寫在小視窗裡（不只是一閃而過的提示），觀眾才不會以為壞掉 */
  const err=j&&j.err;
  if(err==="closed"){setOpen(false);toast(tr("closed"),3800);return}
  const msg=err==="busy"?tr("errBusy"):err==="notfound"?tr("errNotfound"):tr("errNet");
  refreshReq();
  $("rqWhy").hidden=false;$("rqWhy").textContent=msg;
  if(err==="busy"||!err)$("rqOk").disabled=false;
  toast(msg,3800);
}
$("rq").addEventListener("click",e=>{if(e.target===$("rq")||e.target.closest("[data-rq-close]"))closeReq()});
$("rqOk").addEventListener("click",sendReq);
$("rqCopy").addEventListener("click",()=>{const s=rqSong;closeReq();if(s)copy(s)});
addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("rq").hidden)closeReq()});
if(REQ){loadToday();setInterval(()=>{if(!document.hidden)loadToday()},60000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)loadToday()})}

{const c=readCache();if(c){SONGS=c.map((s,i)=>({...s,no:i+1}));syncState="checking"}}
applyUI();loadSheet();
</script>
